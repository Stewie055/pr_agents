[project]
name = "pr-agents"
version = "0.1.0"
description = "Agent-first scaffolding for data visualization and analysis workflows."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "python-multipart",
  "pydantic",
  "pydantic-ai",
  "pydantic-settings",
]

[dependency-groups]
dev = [
  "httpx",
  "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pr_agents"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
