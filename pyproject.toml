[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "semiconductor-diagnostic-agent"
version = "0.1.0"
description = "Agent-enabled semiconductor equipment performance diagnostics platform."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "matplotlib>=3.8,<4",
  "pydantic>=2.8,<3",
  "python-pptx>=0.6.21,<2",
  "python-multipart>=0.0.9,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9",
]

[project.scripts]
semidiag-api = "semidiag.api.main:run"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["semidiag*"]
