[project]
name = "pr-agents"
version = "0.1.0"
description = "Agent-first scaffolding for data visualization and analysis workflows."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.12,<3",
  "pydantic-ai>=0.0.20,<1",
  "pydantic-settings>=2.10,<3",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pr_agents"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
